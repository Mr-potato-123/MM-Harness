[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "m2harness"
version = "0.1.0"
description = "A process-aware industrial harness for mathematical modeling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
media = [
  "Pillow>=10,<12",
  "pypdf>=5,<7",
]
analytics = [
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
]

[project.scripts]
m2harness = "m2harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src", "adapters" = "adapters"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["m2harness*", "adapters*"]

[tool.setuptools.data-files]
"share/m2harness/skills/modeling-core" = ["skills/modeling-core/SKILL.md", "skills/modeling-core/skill.yaml"]
"share/m2harness/skills/modeling-core/references" = ["skills/modeling-core/references/model-contract.md"]
